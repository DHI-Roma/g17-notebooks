  description: |
    The GRACEFUL17 project (Global Governance, Local Dynamics. *Transnational Regimes of Grace
    in the Roman Dataria Apostolica (17th Century)*) investigates papal provisions of ecclesiastical
    offices from a global perspective. Combining classical palaeographic methods with Digital
    Humanities techniques, the project builds an ontology and dataset based on material from the
    *Archivio Apostolico Vaticano*.
    Ontology resources:
    - https://doi.org/10.5281/zenodo.17420005
    - https://dhi-roma.github.io/grace-ontology/docs/widoco/doc/index.html

    The GRACEFUL17 notebooks and dashboards presented here
    provide SPARQL-based overviews of the project data and
    illustrate how other scholars may engage with our dataset.

