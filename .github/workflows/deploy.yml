name: deploy-book
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Jupyter Book v2 + ghp-import
        run: |
          python -m pip install -U "jupyter-book>=2.0.0a0" ghp-import

      - name: Build the book
        run: |
          python -m jupyter_book.cli.main build . -W --keep-going --verbose

      - name: Deploy to GitHub Pages
        run: ghp-import -n -p -f _build/html
