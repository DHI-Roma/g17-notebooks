name: deploy-book

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -U jupyter-book ghp-import
      - name: Inspect repo
        run: |
          pwd
          ls -la
          echo "--- file types ---"
          file README README.md || true
          test -d README && echo "README is a DIR" || echo "README is not a DIR"
          test -d README.md && echo "README.md is a DIR" || echo "README.md is a file"
          echo "--- toc ---"
          cat _toc.yml
          echo "--- config ---"
          cat _config.yml
          echo "--- books ---"
          ls -la books
      - name: Build the book
        run: |
          jupyter-book build .
      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f _build/html