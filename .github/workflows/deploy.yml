name: deploy-book

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -U jupyter-book ghp-import

      - name: Build the book
        working-directory: books
        run: |
          jupyter-book build .

      - name: Inspect build output
        run: |
          ls -al books/_build || true
          ls -al books/_build/html || true

      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f books/_build/html